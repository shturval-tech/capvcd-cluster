{{- if .Values.secure }}
{{/*
Raw key in Secret (Go Data["secret"]): cluster-manager base64-encodes it for EncryptionConfiguration.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-encryption-configuration
  namespace: {{ .Release.Name }}
  labels:
    {{- include "capvcd-cluster.labels" . | nindent 4 }}
type: Opaque
data:
  secret: {{ include "capvcd-cluster.encryptionKeyMaterial" . | b64enc }}
{{- end }}
