{{/*
Провайдер-секрет в namespace capvcd-system — identity для Shturval backend (метка shturval.tech/provider=capcd).

Создание можно отключить через capvcd.createProviderConfig: false,
если identity уже создан через backend UI.
*/}}
{{- if .Values.capvcd.createProviderConfig }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "capvcd-cluster.identitySecretName" . }}
  namespace: {{ .Values.capvcd.credentialsNamespace | default "capvcd-system" }}
  labels:
    shturval.tech/provider: capcd
  annotations:
    {{- include "capvcd-cluster.providerAnnotations" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.capvcd.username | b64enc | quote }}
  password: {{ .Values.capvcd.password | b64enc | quote }}
  refreshToken: {{ .Values.capvcd.refreshToken | b64enc | quote }}
  refresh-token: {{ .Values.capvcd.refreshToken | b64enc | quote }}
{{- end }}
