{{/*
Секрет в namespace кластера — используется CAPVCD через VCDCluster.spec.userContext.secretRef
и cluster-manager CCM (providerSecretRef).

Ключи:
  username / password / refreshToken — CAPVCD controller + CCM
  refresh-token — совместимость с identity Secret Штурвала (backend capcd)
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "capvcd-cluster.identitySecretName" . }}
  namespace: {{ .Release.Name }}
  labels:
    shturval.tech/provider: capcd
    {{- include "capvcd-cluster.labels" . | nindent 4 }}
  annotations:
    {{- include "capvcd-cluster.providerAnnotations" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.capvcd.username | b64enc | quote }}
  password: {{ .Values.capvcd.password | b64enc | quote }}
  refreshToken: {{ .Values.capvcd.refreshToken | b64enc | quote }}
  refresh-token: {{ .Values.capvcd.refreshToken | b64enc | quote }}
