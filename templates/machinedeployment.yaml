{{- range $name, $group := .Values.workerNodes }}
{{- $scale := include "capvcd-cluster.workerGroupScale" (dict "root" $ "name" $name "group" $group) | fromYaml }}
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  namespace: {{ $.Release.Name }}
  labels:
    cluster.x-k8s.io/cluster-name: {{ $.Release.Name }}
    cluster.x-k8s.io/deployment-name: {{ $.Release.Name }}-{{ $name }}
    {{- include "capvcd-cluster.labels" $ | nindent 4 }}
  annotations:
    machinedeployment.clusters.x-k8s.io/revision: "1"
    {{- if $scale.enabled }}
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: {{ $scale.minSize | quote }}
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: {{ $scale.maxMachines | quote }}
    {{- end }}
spec:
  clusterName: {{ $.Release.Name }}
  {{- if not $scale.enabled }}
  replicas: {{ $scale.replicas }}
  {{- end }}
  rollout:
    strategy:
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
      type: RollingUpdate
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: {{ $.Release.Name }}
      cluster.x-k8s.io/deployment-name: {{ $.Release.Name }}-{{ $name }}
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: {{ $.Release.Name }}
        cluster.x-k8s.io/deployment-name: {{ $.Release.Name }}-{{ $name }}
        node-role.kubernetes.io/{{ include "capvcd-cluster.nodeRole" $name }}: ""
        {{- with $group.labels }}
        {{- range . }}
        {{- $kv := splitList "=" . }}
        {{- if eq (len $kv) 2 }}
        {{ index $kv 0 }}: {{ index $kv 1 | quote }}
        {{- else }}
        {{ . | trimSuffix "=" }}: ""
        {{- end }}
        {{- end }}
        {{- end }}
    spec:
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: {{ $.Release.Name }}-{{ $name }}
      clusterName: {{ $.Release.Name }}
      deletion:
        nodeDeletionTimeoutSeconds: 600
        nodeDrainTimeoutSeconds: 600
        nodeVolumeDetachTimeoutSeconds: 300
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: VCDMachineTemplate
        name: {{ $.Release.Name }}-{{ $name }}
      version: v{{ $.Values.kubeVersion }}
---
{{- end }}
