{{- if eq (include "capvcd-cluster.csiSecretWanted" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: vcd-csi-config
  namespace: {{ .Release.Name }}
  labels:
    {{- include "capvcd-cluster.labels" . | nindent 4 }}
type: Opaque
data:
  data: {{ include "capvcd-cluster.csiConfigYaml" . | b64enc | quote }}
{{- end }}
