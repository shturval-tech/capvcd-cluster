apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: VCDMachineTemplate
metadata:
  name: {{ .Release.Name }}-control-plane
  namespace: {{ .Release.Name }}
  labels:
    cluster-name: {{ .Release.Name }}
    cluster.x-k8s.io/cluster-name: {{ .Release.Name }}
    cluster.x-k8s.io/control-plane: "true"
    {{- include "capvcd-cluster.labels" . | nindent 4 }}
spec:
  template:
    spec:
      {{- include "capvcd-cluster.vcdmachine.spec" (dict
        "root" .
        "template" (include "capvcd-cluster.master.template" .)
        "diskSize" (include "capvcd-cluster.master.diskSize" .)
        "sizingPolicy" (include "capvcd-cluster.master.sizingPolicy" .)
      ) | nindent 6 }}
