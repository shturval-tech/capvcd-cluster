# Лицензия Штурвала
licensetoken: "XXXXXXXX"
# Имя хоста с зеркалом Штурвала
systemregistry: myregistry.domain.tld
nameOverride: ""

# shturvalReleaseVersion: 2.11.0
# kubeVersion: 1.33.1
# shturvalReleaseVersion: 2.12.1
# kubeVersion: 1.34.1
# shturvalReleaseVersion: 2.13.1
# kubeVersion: 1.34.3
shturvalReleaseVersion: 2.15.0 # Версия устанавливаемого кластера Штурвал
kubeVersion: 1.36.5 # Версия устанавливаемого кубернетеса

# pause, CoreDNS и cluster-autoscaler берутся из conf/releases/<shturvalReleaseVersion>.yaml.
# Переопределить, если нужно:
# images:
#   pause: r.shturval.tech/pause:3.10.2
#   coreDNS: v1.14.2
#   clusterAutoscaler: r.shturval.tech/autoscaling/cluster-autoscaler:v1.36.1-325745

services:
  # Минимальный набор клиентского кластера 2.15 (service-map configurations.client.minimal
  # после нормализации nginx). Пишется в ClusterConfig только при создании:
  # webhook запрещает менять enabledServices/disabledServices.
  # shturval-gateway-api-crds критичный и в списки не входит: для nginx его
  # включает каталог (ModeAuto), для gateway чарт переносит его в enabledServices.
  # shturval-update в клиентский кластер 2.15 не ставится.
  # Имя disablesservices сохранено: так поле называется в values 2.14.
  enabledservices:
  - shturval-caching-dns
  - shturval-cert-manager
  - shturval-cert-manager-crds
  - shturval-ingress-controller
  - shturval-local-csi
  - shturval-metrics-collector-crds
  - shturval-monitoring-crds
  - shturval-networking
  - shturval-node-config
  - shturval-node-config-crds
  - shturval-policy-manager-crds
  - shturval-services
  - shturval-services-crds
  - shturval-snapshotter
  - shturval-snapshotter-crds
  - shturval-trust-manager
  - shturval-trust-manager-crds
  - shturval-vip
  - shturval-vip-provider
  disablesservices:
  - shturval-backup
  - shturval-backup-crds
  - shturval-cd
  - shturval-cd-crds
  - shturval-cert-expiration
  - shturval-descheduler
  - shturval-log-collector
  - shturval-log-collector-crds
  - shturval-metrics-collector
  - shturval-policy-manager
  - shturval-rollouts
  - shturval-rollouts-crds
  - shturval-scanner
  - shturval-scanner-crds

# Обновление уже установленного чарта не должно менять releaseVersion.
# true — явное согласие запустить обновление платформы (reconcile ClusterConfig).
platformUpgrade: false

# nginx или gateway. nginx не пишется в ClusterConfig (пустое значение = nginx).
ingressControllerType: nginx

# update.strategy пишется в ClusterConfig только если ключ задан: InPlace или RollingUpdate.
# update:
#   strategy: InPlace

# deletePersistentVolumes пишется только если ключ задан явно.
# deletePersistentVolumes: false

infrastructureProvider:
  # auto — создать InfrastructureProvider, если CRD уже есть и объект не занят другим релизом
  # true — создать всегда; false — не создавать
  create: auto

# Конфигурация etcd
etcd:
  external: {}
    # endpoints:
    #   - "https://10.0.0.1:2379"
    # caCrt: "conf/ext_etcd-ca.crt"    # CA сертификат от ETCD
    # apiCrt: "conf/ext_etcd-client.crt" # Клиентский сертификат для подключения к ETCD
    # apiKey: "conf/ext_etcd-client.key" # Ключ от клиентского сертификата
  local:
    dataDir: /var/lib/etcd
    # imageTag берётся из conf/releases/<shturvalReleaseVersion>.yaml.
    # Переопределить, если нужно:
    # imageTag: v3.6.14-324917
    # extraArgs: {}

# Настройки провайдера VMware Cloud Director (CAPVCD)
# Значения, помеченные как обязательные, нужно переопределить перед установкой реального кластера.
capvcd:
  createProviderConfig: true
  credentialsNamespace: capvcd-system
  identitySecretName: ""
  site: "https://vcd.example.com"
  org: ""
  ovdc: ""
  ovdcNetwork: ""
  vipSubnet: ""
  catalog: ""
  # Имя VCD vApp template. Аннотация template.shturval.tech/<kubeVersion>
  # формируется автоматически из template + kubeVersion.
  template: ""
  # Опционально: явная карта версия→template (для нескольких версий в identity Secret).
  # Если для текущей kubeVersion ключа нет — используется capvcd.template.
  kubeTemplates: {}
  sizingPolicy: ""
  sizingPolicies: []
  placementPolicy: ""
  storageProfile: ""
  diskSize: "60Gi"
  # Auth: достаточно одного варианта —
  #   1) username + password, или
  #   2) refreshToken (API Token из VCD UI: User preferences → Access Tokens).
  # Можно задать оба; при наличии refreshToken CAPVCD/CCM предпочитают его.
  username: ""
  password: ""
  refreshToken: ""
  templateNetInterface: eth0
  enableCSI: false
  # При enableCSI=true чарт ставит shturval-capvcd-csi, сам создаёт Secret
  # vcd-csi-config из site/org/ovdc/username/password/refreshToken/storageProfile
  # и убирает shturval-local-csi из enabledServices. providerSecretRef не нужен.
  allowEditCSI: "true"
  ipPoolName: ""
  enableNvidiaGPU: false
  proxyConfig: {}

master: # конфигурация control plane
  replicas: 3 # кол-во мастеров
  template: ""
  diskSize: ""
  sizingPolicy: ""
  # labels:
  #   - "my-custom-label=value"
  # taints:
  #   - key: mytaint/master
  #     effect: NoSchedule
  # MHC включён по умолчанию (как в Shturval 2.14). Отключить: enabled: false
  machineHealthCheck:
    enabled: true
    # checks / remediation можно переопределить; иначе CP = 100%

workerNodes: # динамическая конфигурация worker-групп
  # Группа workers получает label node-role.kubernetes.io/workers.
  workers: # имя группы
    replicas: 2 # кол-во узлов в группе; при autoscaling.enabled — минимум (min-size)
    template: ""
    diskSize: ""
    sizingPolicy: ""
    # autoscaling: # автомасштабирование группы через Cluster API cluster-autoscaler
    #   enabled: true
    #   maxMachines: 6 # максимум узлов; минимум = replicas
    #   # CAPVCD создаёт/удаляет VM в VCD при scale up/down.
    #   # На management-кластере должен существовать ClusterRole shturval-cluster-autoscaler.
    #   # При enabled чарт не пишет MachineDeployment.spec.replicas (владеет autoscaler) — иначе helm-diff/template даёт вечный drift.
    # labels:
    #   - "node.longhorn.io/create-default-disk=true"
    # taints:
    #   - key: mytaint/worker
    #     effect: NoSchedule
    machineHealthCheck:
      enabled: true
      # remediation по умолчанию: unhealthyLessThanOrEqualTo: 40%

  infra: # группа infra-узлов (для сервисов мониторинга, логирования и т.п.)
    replicas: 0
    template: ""
    diskSize: ""
    sizingPolicy: ""
    # labels:
    #   - "my-custom-label-for-infra=myvalue"
    # taints:
    #   - key: mytaint/infra
    #     effect: NoSchedule
    machineHealthCheck:
      enabled: true

# Сеть подов в кластере
podCIDR: 172.16.0.0/16
# Сеть сервисов в кластере
serviceCIDR: 10.96.0.0/12

# IP/FQDN для kube-apiserver (опционально). VCD LB назначает endpoint после создания.
clusterAPI: ""
# Для CAPVCD API обслуживается облачным LB; keepalived/kube-vip обычно не нужны.
useExternalKubeAPILB: true

# Ингресс записи менеджмент-кластера
authMgmtIngress: "shturval.app.mgmt.example.com"
logsMgmtIngress: "logs.app.mgmt.example.com"
metricsMgmtIngress: "vminsert.app.mgmt.example.com"

# Ингресс запись создаваемого кластера
ingress: "app.cluster.example.com"
# IP адрес Ingress контроллера или внешнего балансировщика
ingressVip: ""
# Используется ли внешний балансировщик для Ingress
useExternalIngressLB: true

# Путь до конфигурации кластера (для shturvald и backend)
clusterConfigFile: "conf/clusterConfig.yaml"

auditPolicy:
  # Путь до шаблона audit конфигурации
  template: "conf/audit_policy_template.yaml"
  # Путь расположения файла audit на master нодах
  location: "/etc/kubernetes/audit_policy.yaml"

# Kubeadm patches — патчи для компонентов control plane (kube-apiserver, etcd и любые другие).
# Каждый ключ кроме directory — отдельный файл в каталоге патчей.
# Обязательно: patchTemplate. Опционально: filename (для kubeapi по умолчанию kube-apiserver.yaml, иначе <ключ>.yaml).
kubeadmPatches:
  # Директория с патчами на узле.
  # Рекомендуемое значение: "/etc/kubernetes/manifests-pathes"
  directory: ""
  # kubeapi:
  #   patchTemplate: "conf/kube-apiserver.yaml"
  #   resources:
  #     limits:
  #       memory: "1024Mi"
  #       cpu: "2"
  #     requests:
  #       memory: "500Mi"
  #       cpu: "250m"
  # etcd:
  #   patchTemplate: "conf/etcd.yaml"
  #   resources:
  #     limits:
  #       memory: "500Mi"
  #       cpu: "2"
  #     requests:
  #       memory: "500Mi"
  #       cpu: "2"

# Настройка NTP
ntp:
  ntpservers: []
  timezone: Europe/Moscow

# Secure installation (аудит, шифрование etcd и т.д.)
secure: true

# Пароль для подключения к opensearch (отправка логов)
opensearchfluentbitpass: "mysecretpassword"

# Сабчарт настройки VMAlert/VMRule в менеджмент-кластере под этот клиентский кластер.
# cluster-manager сам создаёт эти объекты (vmalert-/vmrule-/vmalertmanagerconfig-<monitoringId>),
# поэтому по умолчанию выключено. Включайте только для кластера без cluster-manager.
capvcd-cluster-vm:
  enable: false

# Сабчарт добавления datasource этого кластера в grafana менеджмент-кластера
capvcd-cluster-grafana:
  enable: false

# Конфигурация ClusterConfig CR
clusterConfigProfileName: "" # имя профиля кластера (если не указан, используется default-client-cluster-profile)
clusterType: "client" # тип кластера: client или platform (management)

# Конфигурация CSI в ClusterConfig.
# При capvcd.enableCSI=true чарт выбирает shturval-capvcd-csi и создаёт Secret vcd-csi-config.
# Иначе shturval-local-csi. Явный список csi переопределяет выбор.
# Для shturval-capvcd-csi providerSecretRef не нужен: чарт ставит ссылку сам.
# csi:
#   - defaultStorageClass: true
#     serviceConfigName: shturval-capvcd-csi

# Сертификаты для ingress. Варианты взаимоисключающие: выберите один.
#
# Vault PKI
# vault:
#   server: "https://vault.example.com:8200"
#   path: "pki/sign/my-role"
#   mountPath: "/v1/auth/kubernetes"
#   role: "shturval"
#   token: ""
#   caBundle: ""
#   rootCA: ""
#
# ACME
# acme:
#   serverURL: "https://issuer.example.com/acme/directory"
#   rootCABundle: "<base64>"
#   email: "admin@example.com"
#
# Wildcard сертификат (base64)
# ingressCert: ""
# ingressKey: ""
#
# Intermediate CA (base64)
# caCert: ""
# caKey: ""
